name: Reusable checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.14"}
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m black --check src tests scripts example.py
      - name: Run offline tests and enforce coverage
        run: python -m pytest --cov=pyfuncai --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml

  package:
    name: Verify installed distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check annotated and lightweight release tag protocols
        run: python scripts/check_release_refs.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test wheel and source distribution outside checkout
        run: python scripts/check_distribution.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: checked-dist-${{ github.run_id }}
          path: dist/*
