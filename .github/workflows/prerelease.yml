name: Prerelease

on:
  push:
    tags:
      - "v*rc*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag to publish
        required: true
        type: string

concurrency:
  group: prerelease-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify preview tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Validate tag before using it
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "Invalid prerelease tag format."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify ancestry and package version on the tagged commit
        id: verify
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git fetch --no-tags origin "preview:refs/remotes/origin/preview" "refs/tags/$RELEASE_TAG:refs/pyfuncai/release"
          target_sha="$(git rev-parse "refs/pyfuncai/release^{commit}")"
          git merge-base --is-ancestor "$target_sha" origin/preview
          git checkout --detach "$target_sha"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "Tag and package version do not match."
            exit 1
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

  checks:
    name: Validate tagged source
    needs: verify
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  github-prerelease:
    name: Publish verified GitHub prerelease
    runs-on: ubuntu-latest
    needs: [verify, checks]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checked-dist-${{ github.run_id }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          prerelease: true
